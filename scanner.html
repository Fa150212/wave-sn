<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scanner QR Code</title>
  <style>
    body{font-family:system-ui, Arial, sans-serif; margin:16px; background:#f6f9ff}
    #scanner{width:100%; max-width:420px; margin:16px auto}
    video{width:100%; border:2px solid #0b57d0; border-radius:12px}
    button{display:block; margin:12px auto 0; padding:10px 14px; border:1px solid #d9e1ee; border-radius:10px; background:#fff; cursor:pointer}
  </style>
</head>
<body>
  <div id="scanner"></div>
  <p id="result"></p>
  <button onclick="window.location.href='dashboard.html'">⬅ Retour Dashboard</button>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    const scannerDiv = document.getElementById("scanner");
    const html5QrCode = new Html5Qrcode("scanner");

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (decodedText) => {
        document.getElementById("result").innerText = "✅ QR Code détecté : " + decodedText;
        html5QrCode.stop();
      },
      (errorMessage) => { /* erreurs de scan en continu */ }
    ).catch(err => {
      console.error("Caméra indisponible:", err);
      document.getElementById("result").innerText = "Autorise l'accès à la caméra pour scanner.";
    });
  </script>
</body>
</html>
