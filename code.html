<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Code secret - Wave</title>
  <link rel="stylesheet" href="login.css"/>
</head>
<body>
  <div class="login-container">
    <h2>Entrez votre code secret 🔒</h2>
    <form id="code-form">
      <label>Code (4 chiffres)</label>
      <input type="password" id="code" maxlength="4" required/>
      <button type="submit">Valider</button>
    </form>
    <p id="code-error" class="error"></p>
  </div>
  <script src="code.js"></script>
</body>
</html>
